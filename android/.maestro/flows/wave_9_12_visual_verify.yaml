appId: com.hermexapp.android

---
# Wave 9.12 visual verification (proves the icon flip + thumb anchor).
# Repeated sequence to make sure the on-device state is what we expect.

- launchApp:
    clearState: false

# Tap Chat FAB at bottom-right of dashboard.
- tapOn:
    point: 883,2142
- waitForAnimationToEnd

# Compose a long prompt. Maestro's inputText encodes spaces correctly.
- tapOn:
    point: 540,1692
- inputText: "Please reply with a list of 8 numbered items each 2 sentences long about debugging mobile UI scrollbars end each with a period"
- hideKeyboard

# Send via the ↑ in the composer (location at bottom-right of composer).
- tapOn:
    point: 939,1983

# Wait for the first numbered item of the reply.
- extendedWaitUntil:
    visible: "1."
    timeout: 60000

# Snapshot 1: chat at the bottom (just sent + reply received).
- takeScreenshot: /tmp/hermex-verify/A_at_bottom.png

# Scroll up to expose the bar mid-track (so the user can SEE it move).
- swipe:
    start: 540,1500
    end: 540,600
    duration: 250
- waitForAnimationToEnd
- takeScreenshot: /tmp/hermex-verify/B_scrolled_up.png

# Trigger a slow scroll so the pill mounts and is observable.
- swipe:
    start: 540,1500
    end: 540,1100
    duration: 300
- waitForAnimationToEnd

# Assert the pill is visible with the upward arrow (since we scrolled up).
- extendedWaitUntil:
    visible: "Scroll to top"
    timeout: 5000

# Snapshot 2: pill mounted with ↑ arrow (because we're scrolled up).
- takeScreenshot: /tmp/hermex-verify/C_pill_up.png

# Scroll way down so the pill mounts with ↓ arrow (because at the bottom).
- swipe:
    start: 540,500
    end: 540,1500
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: 540,500
    end: 540,1500
    duration: 400
- waitForAnimationToEnd

# Pill should now have ↓ arrow.
- extendedWaitUntil:
    visible: "Scroll to latest"
    timeout: 5000
- takeScreenshot: /tmp/hermex-verify/D_pill_down.png

# Done — four state snapshots.
